[tool.poetry]
name = "menu-mate-backend"
version = "0.1.0"
description = "Family Menu Planner Backend API"
authors = ["Boburmirzo <sobirjonovboburmirzo7@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
django = "5.2.13"
djangorestframework = "3.17.1"
django-environ = "0.12.0"
psycopg2-binary = "2.9.10"
drf-spectacular = "0.28.0"
djangorestframework-simplejwt = "5.5.1"
django-modeltranslation = "^0.20.3"
django-redis = "^6.0.0"
celery = "^5.6.3"
django-celery-results = "^2.6.0"
django-celery-beat = "^2.9.0"
requests = "2.33.1"
phonenumbers = "9.0.28"
pyjwt = "2.12.1"
pytelegrambotapi = "4.25.0"
gunicorn = "^21.2.0"
django-cors-headers = "^4.9.0"
firebase-admin = "^6.5.0"
sentry-sdk = {version = "^2.15.0", extras = ["django", "celery"]}

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.0"
pytest = "^8.0.0"
pytest-django = "^4.8.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
